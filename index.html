<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vini Jr. - O Ousado da Seleção</title>
    <style>
        /* Estilos modernos em modo escuro com borda verde-neon */
        body {
            font-family: sans-serif;
            background-color: #0d1117;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .card {
            background-color: #161b22;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #00e676;
        }

        img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 10px;
        }

        button {
            background-color: #21262d;
            color: white;
            border: 1px solid #30363d;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #30363d;
        }

        button span {
            color: #00e676;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>VINI JR. É O NOVO LÍDER DA SELEÇÃO? ⚡</h1>
        <p>Com muita velocidade e dribles marcantes, Vini Jr. se tornou um dos protagonistas do futebol mundial!</p>

        <!-- Foto do Vinícius Júnior -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/f3/Vinicius_Jr_2018.jpg" alt="Vinícius Júnior">

        <h3>Destaques da Carreira</h3>
        <p>🏆 Campeão da Champions League<br>⚽ Decisivo em grandes decisões</p>

        <p>E aí, qual a sua reação?</p>

        <!-- Botões de reação -->
        <button id="btn-fogo">🔥 Jogando muito <span>0</span></button>
        <button id="btn-craque">👑 Futuro Melhores do Mundo <span>0</span></button>
    </div>

    <script>
        // Pega os botões da página
        const botaoFogo = document.querySelector("#btn-fogo");
        const botaoCraque = document.querySelector("#btn-craque");

        // Função do botão de reação 1
        function reagiuFogo() {
            let numero = botaoFogo.querySelector("span");
            numero.textContent = Number(numero.textContent) + 1;
            console.log("Reação: Jogando muito 🔥");
        }

        // Função do botão de reação 2
        function reagiuCraque() {
            let numero = botaoCraque.querySelector("span");
            numero.textContent = Number(numero.textContent) + 1;
            console.log("Reação: Futuro Melhores do Mundo 👑");
        }

        // Fica ouvindo os cliques
        botaoFogo.addEventListener("click", reagiuFogo);
        botaoCraque.addEventListener("click", reagiuCraque);
    </script>

</body>
</html>
